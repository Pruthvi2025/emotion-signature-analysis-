<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signature Emotion Analysis</title>
    <style>
        /* Global Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #141e30, #243b55);
            color: #fff;
            text-align: center;
        }

        /* Header */
        .header {
            width: 100%;
            padding: 20px 0;
            background: rgba(0, 0, 0, 0.8);
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 50px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .header h1 {
            font-size: 24px;
            letter-spacing: 2px;
            font-weight: bold;
            color: #00c6ff;
        }

        .nav a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            margin: 0 15px;
            padding: 8px 15px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        .nav a:hover {
            background: #00c6ff;
        }

        /* Main Content */
        .main {
            margin-top: 120px;
            padding: 50px 20px;
            text-align: center;
        }

        .title {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
            animation: fadeInDown 1s ease-in-out;
        }

        .upload-box {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeInUp 1s ease-in-out;
        }

        input[type="file"] {
            padding: 10px;
            font-size: 16px;
        }

        .btn-upload {
            background: #00c6ff;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-upload:hover {
            background: #0084c2;
        }

        /* Footer */
        .footer {
            margin-top: 50px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            font-size: 14px;
            color: #bbb;
        }

        /* Animations */
        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>Signature Emotion Analysis</h1>
        <div class="nav">
            <a href="{{ url_for('index') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main">
        <h1 class="title">Emotion analysis of signature images using SVM and RFC</h1>
        
        <!-- File Upload Section -->
        <div class="upload-box">
            <h2>Upload Your Signature</h2>
            <form action="/predict" method="post" enctype="multipart/form-data">
                <input type="file" name="file" required>
                <br><br>
                <button type="submit" class="btn-upload">Analyze</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        &copy; 2025 Emotion analysis of signature images using SVM and RFC | Developed by pruthvimk142@gmail.com | ashithnaidu@gmail.com | dillikattupalem@gmail.com
    </div>

</body>
</html>
